name: Build and Release ClipVault

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/ClipVault.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET MAUI Windows Workload
        run: |
          dotnet workload install maui-windows

      - name: Extract Version Info
        id: versioning
        shell: pwsh
        run: |
          $csproj = [xml](Get-Content "ClipVault.csproj")
          $appVersion = $csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $appVersion) {
            $appVersion = "1.1.4"
          }

          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF.Substring("refs/tags/".Length)
          } else {
            $tag = "v$appVersion"
          }

          Write-Output "VERSION=$appVersion" >> $env:GITHUB_ENV
          Write-Output "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          Write-Output "Resolved Version: $appVersion, Release Tag: $tag"

      - name: Publish Portable Single-File Executable
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:GITHUB_WORKSPACE "publish_output"
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          dotnet publish ClipVault.csproj `
            -f net8.0-windows10.0.19041.0 `
            -p:TargetFrameworks=net8.0-windows10.0.19041.0 `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:WindowsPackageType=None `
            -p:Platform=x64 `
            -o $outputDir

          $baseExe = Join-Path $outputDir "ClipVault.exe"
          $versionedExe = Join-Path $outputDir "ClipVault_v$($env:VERSION).exe"
          if (Test-Path $baseExe) {
            Copy-Item -Path $baseExe -Destination $versionedExe -Force
            Write-Output "Binary generated: $versionedExe"
          } else {
            throw "ClipVault.exe was not found in $outputDir"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-Portable-x64
          path: |
            publish_output/ClipVault.exe
            publish_output/ClipVault_v*.exe
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ClipVault ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            publish_output/ClipVault.exe
            publish_output/ClipVault_v*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
