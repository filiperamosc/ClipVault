name: Build and Release ClipVault

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/ClipVault.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET MAUI Windows Workload
        run: |
          dotnet workload install maui-windows

      - name: Extract Version Info
        id: versioning
        shell: pwsh
        run: |
          $csproj = [xml](Get-Content "ClipVault.csproj")
          $appVersion = $csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $appVersion) {
            $appVersion = "1.5.1"
          }

          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF.Substring("refs/tags/".Length)
          } else {
            $tag = "v$appVersion"
          }

          $binaryName = if ($tag.StartsWith("v")) { "ClipVault-$tag.exe" } else { "ClipVault-v$tag.exe" }

          Write-Output "VERSION=$appVersion" >> $env:GITHUB_ENV
          Write-Output "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          Write-Output "BINARY_NAME=$binaryName" >> $env:GITHUB_ENV
          Write-Output "Resolved Version: $appVersion, Release Tag: $tag, Binary Name: $binaryName"

      - name: Publish Portable Single-File Executable
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:GITHUB_WORKSPACE "publish_output"
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          dotnet publish ClipVault.csproj `
            -f net8.0-windows10.0.19041.0 `
            -p:TargetFrameworks=net8.0-windows10.0.19041.0 `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:WindowsPackageType=None `
            -p:Platform=x64 `
            -o $outputDir

          $baseExe = Join-Path $outputDir "ClipVault.exe"
          $targetExe = Join-Path $outputDir $env:BINARY_NAME
          if (Test-Path $baseExe) {
            Move-Item -Path $baseExe -Destination $targetExe -Force
            Get-ChildItem -Path $outputDir -Filter "*.exe" | Where-Object { $_.Name -ne $env:BINARY_NAME } | Remove-Item -Force
            Write-Output "Single portable binary generated: $targetExe"
          } else {
            throw "ClipVault.exe was not found in $outputDir"
          }

      - name: Generate Changelog for Current Version
        shell: pwsh
        run: |
          git fetch --tags --force
          $tag = $env:RELEASE_TAG
          $allTags = git tag --sort=-creatordate | Where-Object { $_ -ne $tag -and $_ -ne "refs/tags/$tag" }
          $prevTag = $allTags | Select-Object -First 1

          Write-Output "Current release tag: $tag"
          Write-Output "Previous release tag: $prevTag"

          $changelogContent = @()
          $changelogContent += "## ClipVault $tag"
          $changelogContent += ""
          $changelogContent += "### Alterações nesta versão:"

          if ($prevTag) {
            $commits = git log "$prevTag..HEAD" --pretty=format:"* %s (%h)" --no-merges
          } else {
            $commits = git log -n 15 --pretty=format:"* %s (%h)" --no-merges
          }

          if (-not [string]::IsNullOrWhiteSpace($commits)) {
            $changelogContent += $commits
          } else {
            $changelogContent += "* Atualizações de estabilidade, melhorias de interface e otimizações de CI/CD."
          }

          $changelogContent += ""
          $changelogContent += "---"
          $changelogContent += "**Executável Portátil:** \`$($env:BINARY_NAME)\` (Single-file, Self-contained x64 - dispensa instalação)."

          $notesPath = Join-Path $env:GITHUB_WORKSPACE "release_notes.md"
          $changelogContent -join "`n" | Out-File -FilePath $notesPath -Encoding utf8
          Write-Output "RELEASE_NOTES_PATH=$notesPath" >> $env:GITHUB_ENV
          Write-Output "=== Release Notes ==="
          Get-Content $notesPath

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-Portable-x64
          path: publish_output/${{ env.BINARY_NAME }}
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ClipVault ${{ env.RELEASE_TAG }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: publish_output/${{ env.BINARY_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
